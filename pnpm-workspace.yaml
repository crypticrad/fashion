packages:
  - apps/*
  - packages/*

# pnpm blocks dependency build scripts by default. @parcel/watcher (pulled in by
# sass) ships prebuilt binaries, so its install script isn't needed.
allowBuilds:
  '@parcel/watcher': false
  '@prisma/engines': false
  esbuild: true
  prisma: false
  workerd: false

minimumReleaseAgeExclude:
  - '@nestjs/swagger@12.1.2'

permissions:
  '@prisma/orm-postgres':
    skills: true
  '@scarf/scarf':
    build: true
  prisma:
    skills: true

skills:
  dirs:
    - .agent/skills
    - .claude/skills
